name: Network config syntax check

on:
  push:
    branches: [main]
    paths:
      - "auto_config_network.py"
      - "tracker.py"
      - "check_network.py"
      - "main.py"
      - "db.py"
      - ".github/workflows/network-config-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "db.py"
      - "auto_config_network.py"
      - "tracker.py"
      - "check_network.py"
      - "main.py"
      - ".github/workflows/network-config-check.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile auto_config_network.py tracker.py check_network.py main.py db.py
