4.4 — Auto-promoção no trust_daemon.py (ou main.py)
Onde você já tem o daemon rodando a cada 30s, adicione:

python
def _promotion_tick(chain, trust, interval: int = 60):
    """
    A cada `interval` segundos, percorre todos os nós da trust e
    marca como 'validator' quem atende a política.
    """
    import time, logging
    log = logging.getLogger("trust_daemon.promotion")
    while True:
        time.sleep(interval)
        try:
            import validator_policy as _vp
        except ImportError:
            continue
        try:
            if trust is None or not hasattr(trust, "nodes"):
                continue
            promoted_now = []
            for pk, n in (trust.nodes or {}).items():
                old_level = getattr(n, "trust_level", "new")
                if _vp.should_promote(n):
                    if old_level != "validator":
                        try:
                            n.trust_level = "validator"
                        except Exception:
                            pass
                        promoted_now.append(pk)
                else:
                    if old_level == "validator":
                        try:
                            n.trust_level = "trusted"  # caiu abaixo do threshold
                        except Exception:
                            pass
            if promoted_now:
                log.warning("[PROMOTION] %d nó(s) promovido(s): %s",
                            len(promoted_now),
                            ", ".join(p[:12] for p in promoted_now[:5]))
                try:
                    if hasattr(trust, "flush"):
                        trust.flush()
                except Exception:
                    pass
                try:
                    chain._fork_signal = None  # força re-leitura
                except Exception:
                    pass
        except Exception as e:
            log.debug("[PROMOTION] tick: %s", e)


# No _setup_trust_daemon (main.py), adicione:
