Sim, dá — mas você está prestes a criar o vetor de ataque mais clássico de blockchain
Vou responder as duas camadas: "é possível?" (sim, e 70% já existe no seu código) e "é seguro?" (não, do jeito que você descreveu — vou explicar o Sybil Attack e como blindar).

Parte 1 — O que você quer, traduzido em arquitetura
O fluxo que você descreveu:

text
1. Cliente cria carteira
2. Manda announce para N peers (não só Origin)
3. Cada peer verifica score do cliente
4. Score >= 140 → cliente vira validador
5. Top scores recebem assinatura de blocos
6. Validam trabalho + bloco
7. Bloco entra na blockchain
Isso é exatamente o mecanismo trust_score → validators → multi-sig → chain que já existe no seu código. A diferença é que hoje:

Só o Origin aceita announce (server.py: if not is_origin: return 403)

O threshold 150 está hardcoded no display do /trust/nodes, mas não no blockchain.py

A trust_network pode não ter update_score automático (depende do trust_daemon)

Então o que falta é: (a) tirar o gate de Origin no announce, (b) adicionar threshold configurável no _get_active_validators, (c) implementar auto-promoção por score.

⚠️ Parte 2 — O problema (leia antes de codar)
Sybil Attack, em uma frase: se "score >= 140" é o único critério, e score é calculado por uptime/online/assinaturas, então:

Atacante sobe 100 VPS por €4/mês = €400/mês

Cada uma cria carteira, anuncia, fica online 30 dias

Cada uma atinge score 140

Atacante agora tem 100 de 120 validadores = 83%

Minerar bloco fraudulento → assina com 100 chaves → aceito por todos

Rollback de fork profundo é impossível

E se score também contar "assinou blocos aceitos": pior ainda, porque o próprio atacante controla o que é "aceito".

O único jeito de blindar sem staking é:

Mitigação	O que faz	Custo pro atacante
Cap por /24	Máx 2 validadores por faixa de IP	€400 → €4.000/mês (100 faixas diferentes)
Timelock	Score 140 há ≥30 dias para virar validador	Tempo (atacante espera 30 dias) + bots mantidos
Prova de trabalho histórico	Score cresce com blocos válidos assinados (verificado por peers)	Precisa minerar PoW válido, não só ficar online
Quórum 67% do top-N	Precisa de vários grandes, não um só	Sybil precisa dominar top-5, não top-100
Vou entregar o código com as 4 mitigações ativáveis por env. Sem elas, é suicídio.

