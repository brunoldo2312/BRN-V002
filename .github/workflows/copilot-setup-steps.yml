4.1 — validator_policy.py (novo, completo)
Toda a lógica de "quem é validador" em um lugar só. Ativável por env.

python
"""validator_policy.py — Política de validadores por score (v1.0)
================================================================
Config por env:
  BRN_MIN_VALIDATOR_SCORE       default 140
  BRN_MAX_VALIDATORS            default 5  (top-N por score)
  BRN_VALIDATOR_TIMELOCK_DAYS   default 0  (0 = sem timelock)
  BRN_VALIDATOR_MAX_PER_SUBNET  default 2  (/24; 0 = sem cap)
  BRN_VALIDATOR_REQUIRE_POW     default 0  (1 = exige ≥1 bloco assinado)
  BRN_VALIDATOR_QUORUM          default 0.67
  BRN_VALIDATOR_STRICT          default 0  (1 = exige quorum estrito)
================================================================
"""
from __future__ import annotations
import ipaddress
import logging
import os
import time

log = logging.getLogger("validator_policy")

MIN_SCORE = int(os.environ.get("BRN_MIN_VALIDATOR_SCORE", "140"))
MAX_VALIDATORS = max(1, int(os.environ.get("BRN_MAX_VALIDATORS", "5")))
TIMELOCK_DAYS = max(0, int(os.environ.get("BRN_VALIDATOR_TIMELOCK_DAYS", "0")))
TIMELOCK_S = TIMELOCK_DAYS * 86400
MAX_PER_SUBNET = max(0, int(os.environ.get("BRN_VALIDATOR_MAX_PER_SUBNET", "2")))
REQUIRE_POW = os.environ.get("BRN_VALIDATOR_REQUIRE_POW", "0") == "1"
QUORUM = float(os.environ.get("BRN_VALIDATOR_QUORUM", "0.67"))
STRICT = os.environ.get("BRN_VALIDATOR_STRICT", "0") == "1"

if QUORUM <= 0 or QUORUM > 1:
    QUORUM = 0.67


def _node_score(n) -> float:
    try:
        return float(getattr(n, "trust_score", 0) or 0)
    except Exception:
        return 0.0


def _node_banned(n) -> bool:
    return bool(getattr(n, "banned", False))


def _node_pubkey(n) -> str:
    return (getattr(n, "public_key", "") or "").strip().lower()


def _node_subnet(n) -> str:
    """
    Extrai /24 do endereço. Usa:
      1. n.peer_addr ("ip:port")   ← preferencial
      2. n.address
    Retorna "" se não conseguir.
    """
    for attr in ("peer_addr", "address"):
        addr = (getattr(n, attr, "") or "").strip()
        if not addr:
            continue
        ip = addr.rsplit(":", 1)[0] if ":" in addr else addr
        try:
            ip_obj = ipaddress.ip_address(ip)
            if ip_obj.version == 4:
                net = ipaddress.ip_network(f"{ip}/24", strict=False)
                return str(net)
            if ip_obj.version == 6:
                net = ipaddress.ip_network(f"{ip}/64", strict=False)
                return str(net)
        except ValueError:
            continue
    return ""


def _first_seen_ts(n) -> float:
    """Timestamp de quando o nó entrou (assume n.first_seen, fallback 0)."""
    try:
        return float(getattr(n, "first_seen", 0) or 0)
    except Exception:
        return 0.0


def _has_signed_block(n) -> bool:
    """
    True se o nó já assinou ≥1 bloco aceito.
    Assume n.blocks_signed (int) ou n.signed_blocks (int).
    """
    for attr in ("blocks_signed", "signed_blocks", "signatures_count"):
        try:
            v = getattr(n, attr, 0) or 0
            if int(v) > 0:
                return True
        except Exception:
            pass
    return False


def compute_active_validators(trust, now: float = None) -> list:
    """
    Aplica a política e retorna a lista de pubkeys ativas.

    Etapas:
      1. Filtra score >= MIN_SCORE
      2. Filtra banidos
      3. Aplica timelock (first_seen + TIMELOCK_S <= now)
      4. Aplica REQUIRE_POW (só se ativo)
      5. Aplica cap por /24 (mantém os top-N por score em cada subnet)
      6. Aplica cap total (top-MAX_VALIDATORS por score)
      7. Retorna pubkeys
    """
    now = now or time.time()
    if trust is None or not hasattr(trust, "nodes"):
        return []

    candidates = []
    for n in (getattr(trust, "nodes", {}) or {}).values():
        pk = _node_pubkey(n)
        if not pk:
            continue
        score = _node_score(n)
        if score < MIN_SCORE:
            continue
        if _node_banned(n):
            continue

        # Timelock
        if TIMELOCK_S > 0:
            first = _first_seen_ts(n)
            if first <= 0 or (now - first) < TIMELOCK_S:
                log.debug("[POLICY] %s rejeitado por timelock (first=%s, agora=%.0f)",
                          pk[:12], first, now)
                continue

        # Prova de trabalho
        if REQUIRE_POW and not _has_signed_block(n):
            log.debug("[POLICY] %s rejeitado por REQUIRE_POW", pk[:12])
            continue

        candidates.append({
            "pubkey": pk,
            "score": score,
            "subnet": _node_subnet(n),
        })

    # Cap por subnet
    if MAX_PER_SUBNET > 0:
        by_subnet: dict = {}
        for c in candidates:
            if c["subnet"]:
                by_subnet.setdefault(c["subnet"], []).append(c)
            else:
                # Sem subnet: cap individual (trata como único)
                by_subnet.setdefault(f"nonsubnet:{c['pubkey']}", []).append(c)

        filtered = []
        for subnet, items in by_subnet.items():
            items.sort(key=lambda x: -x["score"])
            filtered.extend(items[:MAX_PER_SUBNET])
        candidates = filtered

    # Cap total
    candidates.sort(key=lambda x: -x["score"])
    candidates = candidates[:MAX_VALIDATORS]

    pubkeys = sorted({c["pubkey"] for c in candidates})

    if pubkeys:
        log.info(
            "[POLICY] %d validador(es) ativos (min_score=%d max=%d "
            "timelock=%dd cap_subnet=%d require_pow=%s)",
            len(pubkeys), MIN_SCORE, MAX_VALIDATORS,
            TIMELOCK_DAYS, MAX_PER_SUBNET, REQUIRE_POW,
        )
    else:
        log.warning("[POLICY] Nenhum validador atende a política "
                    "(min_score=%d, candidatos=%d)",
                    MIN_SCORE, len(getattr(trust, "nodes", {}) or {}))

    return pubkeys


def required_signatures(n_validators: int) -> int:
    """Quórum: STRICT exige ALL; senão ceil(n * QUORUM)."""
    if n_validators <= 0:
        return 0
    if STRICT:
        return n_validators
    import math
    return max(1, math.ceil(n_validators * QUORUM))


def should_promote(node, now: float = None) -> bool:
    """
    Verifica se um nó individual atende a todos os critérios.
    Útil para o trust_daemon auto-promover.
    """
    now = now or time.time()
    if node is None:
        return False
    if _node_banned(node):
        return False
    if _node_score(node) < MIN_SCORE:
        return False
    if TIMELOCK_S > 0:
        first = _first_seen_ts(node)
        if first <= 0 or (now - first) < TIMELOCK_S:
            return False
    if REQUIRE_POW and not _has_signed_block(node):
        return False
    return True


def status() -> dict:
    return {
        "min_score": MIN_SCORE,
        "max_validators": MAX_VALIDATORS,
        "timelock_days": TIMELOCK_DAYS,
        "max_per_subnet": MAX_PER_SUBNET,
        "require_pow": REQUIRE_POW,
        "quorum": QUORUM,
        "strict": STRICT,
    }
