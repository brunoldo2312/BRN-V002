@app.route("/api/validator/announce", methods=["POST"])
@require_rate_limit("validator_announce")
def api_validator_announce():
    """
    [v9.9.42] Announce descentralizado: QUALQUER nó com trust network
    aceita. Promoção a validador depende de score (validator_policy).
    """
    try:
        data = request.get_json(force=True) or {}
        pubkey = (data.get("pubkey") or "").strip().lower()
        address = (data.get("address") or "").strip()
        peer_addr = (data.get("peer_addr") or "").strip()

        if not pubkey or len(pubkey) < 32:
            return jsonify({"ok": False, "msg": "pubkey inválida"}), 400
        try:
            int(pubkey, 16)
        except ValueError:
            return jsonify({"ok": False, "msg": "pubkey não é hex"}), 400

        trust = _get_trust_network()
        if trust is None:
            return jsonify({"ok": False, "msg": "TrustNetwork indisponível"}), 503

        # --- REGISTRA (todos aceitam, não só origin) ---
        try:
            if hasattr(trust, "sync_local_validator"):
                trust.sync_local_validator(pubkey, address or "", peer_addr)
            elif hasattr(trust, "register_node"):
                trust.register_node(
                    node_id=pubkey,
                    address=address or pubkey[:16],
                    public_key=pubkey,
                    peer_addr=peer_addr,
                )
                if hasattr(trust, "mark_connected"):
                    trust.mark_connected(pubkey)
            elif hasattr(trust, "ensure_peer_entry"):
                trust.ensure_peer_entry(pubkey)
        except Exception as e:
            log.warning("[announce] register falhou: %s", e)
            return jsonify({"ok": False, "msg": str(e)}), 500

        # --- SCORE +1 por announce (uptime) ---
        try:
            if hasattr(trust, "update_score"):
                trust.update_score(pubkey, "heartbeat_ok")
        except Exception:
            pass

        try:
            trust.flush()
        except Exception:
            pass

        # --- Avalia política ---
        try:
            import validator_policy as _vp
            node = (getattr(trust, "nodes", {}) or {}).get(pubkey)
            is_validator = _vp.should_promote(node) if node else False
            score = float(getattr(node, "trust_score", 0) or 0) if node else 0
            pubkeys_ativas = _vp.compute_active_validators(trust) if node else []
        except ImportError:
            is_validator = False
            score = 0
            pubkeys_ativas = []
        except Exception:
            is_validator = False
            score = 0
            pubkeys_ativas = []

        # --- Propaga para peers (não origin) ---
        propagated = 0
        try:
            p2p = _get_p2p_manager()
            if p2p is not None and hasattr(p2p, "broadcast_validator_registration"):
                # Evita loop: só propaga se pubkey != eu
                if pubkey != (_BRN_PEER_ID or ""):
                    p2p.broadcast_validator_registration(
                        pubkey, address or pubkey[:16]
                    )
                    propagated = 1
        except Exception:
            pass

        _invalidate_mining_gate_cache()

        return jsonify({
            "ok": True,
            "pubkey": pubkey,
            "score": round(score, 1),
            "is_validator": is_validator,
            "active_validators": len(pubkeys_ativas),
            "propagated": bool(propagated),
        }), 200
    except Exception as e:
        log.exception("announce falhou")
