Resumo em uma frase
Sim, é tecnicamente possível — o mecanismo já existe no seu blockchain.py (_get_active_validators + _validate_validators_sig). Falta só: (a) tirar o gate de Origin no announce, (b) implementar validator_policy.py com threshold 140 configurável, (c) broadcast dos clientes para peers.

Mas sem anti-Sybil, é suicídio. Ative obrigatoriamente:

BRN_VALIDATOR_MAX_PER_SUBNET=1 (1 validador por /24)

BRN_VALIDATOR_TIMELOCK_DAYS=7 (mínimo absoluto; 30 ideal)

BRN_VALIDATOR_REQUIRE_POW=1 (precisa ter minerado ≥1 bloco)

E resolva o problema prático antes: Render free dorme, perde score, sai do set. Configure health check externo que pinga a cada 5 min, ou migre para Render pago / VPS. Sem isso, o próprio Origin vai ser rebaixado pelo sistema que você está criando.

