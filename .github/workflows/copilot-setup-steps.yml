Deve retornar "is_validator": false, "score": 0 ou similar. Não promove — só registra.

Teste 3 — Verificar que o bloco exige quórum
Com 3 validadores ativos e QUORUM=0.67, o próximo bloco deve ter ≥2 assinaturas (ceil(3*0.67)=2). Verifique:

bash
# Após minerar, checa o último bloco
curl https://brn-v002.onrender.com/api/block/$(curl -s .../api/status | jq .height) \
  | jq '.validators_sig | length'
Teste 4 — Simular Sybil (bem controlado)
Em ambiente de teste:

Setar BRN_MIN_VALIDATOR_SCORE=10 (baixo)

Setar BRN_VALIDATOR_MAX_PER_SUBNET=0 (sem cap) e TIMELOCK=0

Criar 10 carteiras e anunciar

Verificar que todas viram validador

Agora ative MAX_PER_SUBNET=1 → verificar que só 1 por subnet fica ativo

Ative TIMELOCK=1 (1 dia) → verificar que nenhuma das novas fica ativa

Não rode em produção — é para você ver a diferença.

Parte 7 — Riscos residuais (honestidade total)
Mesmo com tudo ativado:

Risco	Probabilidade	Mitigação
Atacante com €2k ataca	Baixa em rede pequena	Monitore consensus_validators diariamente
Reorg por divisão de validadores	Média durante bootstrap	REQUIRE_ALL_SIGS (quorum=100%) se < 3 validadores
Score inflado por bot network	Alta sem POW	REQUIRE_POW=1
Nó honesto perde score por downtime	Alta (Render free dorme)	Health checks + restart automático — seu maior problema prático
trust_network.json corromper	Baixa	Backup /api/backup periódico
O problema #4 é o maior. Render free dorme por 15 min inativo. Se isso conta como "downtime" e baixa o score, o Origin perde score sozinho e eventualmente sai do set de validadores. Recomendação: score não deve cair por inatividade curta (<1h). Ajuste no trust_network.update_score para ter "grace period".

