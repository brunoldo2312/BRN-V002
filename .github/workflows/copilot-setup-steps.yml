4.5 — peer_broadcast.py (novo, para clientes)
O cliente precisa mandar announce para N peers, não só pro Origin:

python
"""peer_broadcast.py — Cliente anuncia para todos os peers (v1.0)"""
import json
import logging
import threading
import time
import urllib.error
import urllib.request
from typing import Optional

log = logging.getLogger("peer_broadcast")


def broadcast_announce(
    pubkey: str,
    address: str,
    peer_addr: str,
    peers: list,
    timeout: float = 3.0,
) -> dict:
    """
    Envia POST /api/validator/announce para cada peer.
    Retorna {"ok": N, "fail": M, "errors": [...]}.
    """
    payload = json.dumps({
        "pubkey": pubkey,
        "address": address,
        "peer_addr": peer_addr,
    }).encode("utf-8")

    ok = 0
    fail = 0
    errors = []
    for p in peers:
        if not isinstance(p, str) or ":" not in p:
            continue
        ip, port_s = p.rsplit(":", 1)
        if ip.startswith("127.") or ip == "0.0.0.0":
            continue
        try:
            port = int(port_s)
            # HTTP: assume que peer HTTP está em port + 5000? 
            # Melhor: usar BRN_POOL_URLS ou bootstrap
            url = f"http://{ip}:{port}/api/validator/announce"
            req = urllib.request.Request(
                url, data=payload,
                headers={"Content-Type": "application/json"},
                method="POST",
            )
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                if 200 <= resp.status < 300:
                    ok += 1
                else:
                    fail += 1
        except Exception as e:
            fail += 1
            errors.append(f"{p}: {e}")

    log.info("[BROADCAST] announce: %d ok, %d fail", ok, fail)
    return {"ok": ok, "fail": fail, "errors": errors[:5]}


def announce_loop(
    pubkey: str,
    address: str,
    peer_addr: str,
    peer_provider,
    interval: int = 120,
    stop_evt: Optional[threading.Event] = None,
):
    """Loop de announce a cada `interval` segundos."""
    stop_evt = stop_evt or threading.Event()
    while not stop_evt.wait(interval):
        try:
            peers = peer_provider() or []
            if peers:
                broadcast_announce(pubkey, address, peer_addr, peers)
        except Exception as e:
            log.debug("[BROADCAST] loop: %s", e)
