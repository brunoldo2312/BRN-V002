Parte 5 — Mitigação Sybil (o único jeito seguro)
Sem isso, NÃO ATIVE. O sistema vira um alvo fácil.

5.1 — Ativar as 4 mitigações no .env (prod)
bash
# Thresholds
BRN_MIN_VALIDATOR_SCORE=140
BRN_MAX_VALIDATORS=5
BRN_VALIDATOR_QUORUM=0.67
BRN_VALIDATOR_STRICT=1              # exige quorum (mas não ALL)

# Anti-Sybil (obrigatório)
BRN_VALIDATOR_MAX_PER_SUBNET=1      # 1 validador por /24
BRN_VALIDATOR_TIMELOCK_DAYS=30      # 30 dias de idade mínima
BRN_VALIDATOR_REQUIRE_POW=1         # precisa ter assinado ≥1 bloco antes
5.2 — O que cada uma faz na prática
Atacante tenta...	MAX_PER_SUBNET=1 bloqueia?	TIMELOCK=30d bloqueia?	REQUIRE_POW=1 bloqueia?
100 VPS na mesma /24	✅ Sim (só 1 conta)	—	—
100 VPS em /24 diferentes	❌ Não (cap não vê)	✅ Sim (30 dias)	✅ Sim (bloco precisa ser assinado)
Bot farm por 30 dias	—	❌ Não (passou)	✅ Sim (precisa ter minerado PoW válido)
Comprar validadores existentes	—	—	— (mas está fora do escopo)
Com os 3 ativos, atacante precisa:

N /24 subnets diferentes (custa €4/mês por subnet, ~€400/mês para 100)

30 dias de uptime (custo de orquestração)

PoW real assinado (compartilhar bloco = custo de mineração)

Preço total para ataque 51%: ~€2.000–5.000 + 30 dias de paciência. Viável para atacante determinado, mas proibitivo para amador.

5.3 — Se você não quer TIMELOCK=30 (rede nova)
Use BRN_VALIDATOR_TIMELOCK_DAYS=7 como mínimo absoluto. Abaixo disso, a rede fica muito exposta a Sybil durante o bootstrap.

Alternativa: comece com BRN_MAX_VALIDATORS=3 + TIMELOCK=7. Rede pequena, se der fork, você percebe e responde.

